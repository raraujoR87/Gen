name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Used by tests/conftest.py::database_url; matches the postgres service
  # below. Individual unit test files that don't touch the DB are unaffected.
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/arbitrage_test
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET: ci-test-secret-do-not-use-in-prod
  JWT_ALGORITHM: HS256
  JWT_EXPIRE_MINUTES: "60"

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arbitrage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}

  # Best-effort Android lint. android/ (unit-owned Kotlin/Jetpack Compose app)
  # may not have a fully working Gradle wrapper/build configuration yet since
  # it is developed in parallel with the backend units — this job is
  # informational only (continue-on-error) and must never block the backend
  # job or block merges. Once android/ has a working ./gradlew wrapper and
  # build.gradle(.kts) setup, this can be promoted to a required check.
  android-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run Android lint
        working-directory: android
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew lint
          else
            echo "No Gradle wrapper found in android/ yet — skipping lint (non-blocking)."
          fi
