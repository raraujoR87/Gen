name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Used by tests/conftest.py::database_url; matches the postgres service
  # below. Individual unit test files that don't touch the DB are unaffected.
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/arbitrage_test
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET: ci-test-secret-do-not-use-in-prod
  JWT_ALGORITHM: HS256
  JWT_EXPIRE_MINUTES: "60"

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arbitrage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}

  # Builds the real debug APK and runs the JVM unit tests. This is the first
  # environment in the whole project with actual Android SDK access (the dev
  # sandbox this app was built in has no SDK and its egress proxy blocks
  # dl.google.com) — so this job is where the Kotlin code gets compiled for
  # real for the first time. continue-on-error keeps a build failure here
  # from blocking the backend job / merges while the Android side is still
  # maturing; check this job's logs/artifact to see whether it actually
  # succeeded rather than assuming green.
  android-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform + build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Run JVM unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        working-directory: android
        run: ./gradlew lint --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
